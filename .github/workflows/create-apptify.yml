name: Test create-apptify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  create:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run prepack
      - run: npm run test:create
