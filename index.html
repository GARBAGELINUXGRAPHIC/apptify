<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <style>html, body { background-color: var(--app-page-bg, #f5f5f7); }</style>
    <script>
      // Apply the saved page canvas before the application bundle can paint.
      try {
        const preference = JSON.parse(localStorage.getItem('apptify:preferences') || '{}');
        const dark = preference.theme === 'dark' || (preference.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        const background = preference.theme === 'graphite' ? '#f3f4f4' : preference.theme === 'rose' ? '#faf7f8' : dark ? '#161617' : '#f5f5f7';
        document.documentElement.style.setProperty('--app-page-bg', background);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', background);
      } catch { /* Storage can be unavailable; the default canvas remains valid. */ }
    </script>
    <meta name="description" content="Apptify: Apple-inspired Vue 3 components. Built for every screen." />
    <title>Apptify · 组件实验室</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/playground/main.ts"></script>
  </body>
</html>
