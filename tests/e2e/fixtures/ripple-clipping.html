<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ripple boundaries</title>
<style>
body { margin: 0; } main { padding: 24px; max-width: 800px; display: grid; gap: 28px; }
.controls { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.rounded { border-radius: 18px; background: var(--apple-surface); }
.probe { width: 160px; height: 64px; border: 0; border-radius: 24px 8px 20px 0; background: var(--apple-surface); color: var(--apple-accent); }
.ink { display: inline-block; width: 18px; height: 18px; background: #ef2312; }
.overflow-probe { position: absolute; top: -10px; right: -10px; width: 20px; height: 20px; background: #17cf28; }
#nested { padding: 18px; border-radius: 22px; background: var(--apple-surface); }
#nested button { width: 90px; height: 44px; border: 0; border-radius: 999px; background: var(--apple-surface-alt); color: var(--apple-text); }
.teleport-panel { padding: 20px; }
</style></head><body><div id="app"></div><div id="teleport-target"></div><script type="module">
import { ArrowRight } from 'lucide-vue-next'
import { createApp, h, Teleport } from 'vue'
import { createAppleUI, AppleProvider, AppleButton, AppleLink, AppleInput, AppleSelect, AppleStepper, AppleSteps, ApplePagination, AppleAccordion, AppleList, AppleTree, AppleTable, AppleDatePicker, AppleMenu, AppleBackTop, ripple } from '/src/index.ts'
const params = new URLSearchParams(location.search)
createApp({
  data: () => ({ mode: params.get('motion') || 'full', shown: true, disabled: false, value: 'Typed value', quantity: 4, selection: 'one', commits: 0 }),
  render() {
    const raw = (id, children, extra = {}) => ripple(h('button', { id, type: 'button', class: 'probe', disabled: this.disabled, onClick: () => this.commits++, ...extra }, children))
    const send = () => h(AppleButton, { variant: 'secondary' }, () => '发送')
    const items = [{ value: 'one', label: '第一项', content: '展开后的内容' }, { value: 'two', label: '第二项', content: '第二项内容' }]
    return h(AppleProvider, { theme: params.get('theme') || 'light', motion: this.mode }, () => [h('main', [
      h('div', { class: 'controls' }, [h(AppleButton, { id: 'pill', icon: ArrowRight }, () => '主按钮'), h(AppleButton, { id: 'disabled', disabled: true }, () => '暂不可用'), h(AppleLink, { as: 'button', id: 'text-link' }, () => '文字按钮')]),
      this.shown ? raw('layering', [h('span', { class: 'ink' }), ' Text ', h('svg', { width: 18, height: 18, viewBox: '0 0 18 18' }, h('rect', { x: 2, y: 2, width: 14, height: 14, fill: '#17cf28' })), h('span', { class: 'overflow-probe' })]) : null,
      h('section', { id: 'suffix' }, h(AppleInput, { modelValue: this.value, label: '后缀按钮' }, { suffix: send })),
      h('section', { id: 'prefix' }, h(AppleInput, { modelValue: this.value, label: '前缀按钮' }, { prefix: send })),
      h('section', { id: 'stepper' }, h(AppleStepper, { modelValue: this.quantity, min: 0, max: 9, label: '显示人数', 'onUpdate:modelValue': value => this.quantity = value })),
      h('section', { id: 'steps' }, h(AppleSteps, { clickable: true, modelValue: 1, items })),
      h('section', { id: 'pagination' }, h(ApplePagination, { modelValue: 2, total: 50 })),
      h(AppleAccordion, { id: 'accordion', class: 'rounded', items }),
      h(AppleList, { id: 'list', class: 'rounded', selectable: true, items }),
      h(AppleTree, { id: 'tree', items }),
      h(AppleTable, { id: 'table', columns: [{ key: 'label', label: '名称', sortable: true }], rows: items }),
      h(AppleSelect, { id: 'select', label: '选择项目', modelValue: this.selection, items }),
      h(AppleDatePicker, { id: 'date', label: '日期', modelValue: '2026-10-02' }),
      h(AppleMenu, { label: '浮层菜单', items }, { activator: () => h(AppleButton, { id: 'menu-trigger' }, () => '打开菜单') }),
      h(AppleBackTop, { id: 'back-top', target: 'window', visibilityHeight: 0, fixed: false }),
      ripple(h('div', { id: 'nested' }, [h('span', '外层'), ripple(h('button', { id: 'nested-child', type: 'button' }, '内层'))])),
      h('div', { class: 'controls' }, [h('button', { id: 'none', onClick: () => this.mode = 'none' }, '无动效'), h('button', { id: 'full', onClick: () => this.mode = 'full' }, '完整动效'), h('button', { id: 'disable-probe', onClick: () => this.disabled = !this.disabled }, '禁用探针'), h('button', { id: 'unmount-probe', onClick: () => this.shown = false }, '移除探针')]),
      h('output', { id: 'commits' }, this.commits),
    ]), h(Teleport, { to: '#teleport-target' }, h(AppleProvider, { theme: params.get('theme') || 'light', motion: this.mode, class: 'teleport-panel' }, () => raw('teleported', '传送按钮')))])
  },
}).use(createAppleUI()).mount('#app')
</script></body></html>
