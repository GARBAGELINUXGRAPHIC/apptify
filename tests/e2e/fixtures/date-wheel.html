<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date wheel</title><style>body{margin:0}main{padding:20px 16px;max-width:420px}#value{display:block;margin-top:520px}.test-controls{display:flex;gap:8px;margin-top:16px}</style></head><body><div id="app"></div><script type="module">
import {createApp,h} from 'vue'
import {createAppleUI,AppleProvider,AppleDatePicker} from '/src/index.ts'
const params=new URLSearchParams(location.search)
const app=createApp({
 data:()=>({value:params.has('value')?params.get('value'):'2026-10-03T12:30:15',disabled:false,loading:false,updates:[],changes:[]}),
 mounted(){window.dateWheelDemo=this},
 render(){return h(AppleProvider,{theme:params.get('theme')||'light',motion:params.get('motion')||'full'},()=>h('main',[
  h(AppleDatePicker,{label:'预约时间',format:params.get('format')||'YYYY/MM/DD HH:mm:ss',modelValue:this.value,disabled:this.disabled,loading:this.loading,min:params.get('min')||undefined,max:params.get('max')||undefined,'onUpdate:modelValue':value=>{this.value=value;this.updates.push(value)},onChange:value=>this.changes.push(value)}),
  h('output',{id:'value'},this.value),h('output',{id:'updates'},JSON.stringify(this.updates)),
  h('div',{class:'test-controls'},[h('button',{onClick:()=>this.disabled=!this.disabled},'禁用'),h('button',{onClick:()=>this.loading=!this.loading},'加载')]),
 ]))}
})
app.use(createAppleUI()).mount('#app')
</script></body></html>
