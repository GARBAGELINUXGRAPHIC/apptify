<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date TabBar motion</title><style>body{margin:0}main{padding:24px;max-width:420px}main .apple-card{padding:24px;overflow:visible}#value{display:block;margin-top:450px}</style></head><body><div id="app"></div><script type="module">
import {createApp,h} from 'vue'
import {createAppleUI,AppleProvider,AppleCard,AppleDatePicker} from '/src/index.ts'
const params=new URLSearchParams(location.search)
createApp({data:()=>({value:'2026-09-26T12:30'}),render(){return h(AppleProvider,{theme:params.get('theme')||'light',motion:params.get('motion')||'full'},()=>h('main',[h(AppleCard,{},()=>h(AppleDatePicker,{label:'到店时间',type:'datetime-local',modelValue:this.value,'onUpdate:modelValue':value=>this.value=value})),h('output',{id:'value'},this.value)]))}}).use(createAppleUI()).mount('#app')
</script></body></html>
