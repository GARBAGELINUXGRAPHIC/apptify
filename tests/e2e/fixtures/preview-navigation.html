<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Preview navigation transitions</title>
<style>
body { margin: 0; background: #f5f5f7; }
#page-aside { position: fixed; left: 0; top: 64px; bottom: 0; width: 112px; z-index: 60; box-sizing: border-box; padding: 32px 14px; border-right: 1px solid #ddd; background: rgb(255 255 255 / 90%); backdrop-filter: blur(2px) saturate(2); }
#page-aside a { display: block; margin-bottom: 24px; }
#origin { position: absolute; width: 240px; left: 132px; top: 160px; }
#second { position: absolute; width: 200px; left: 148px; top: 460px; }
.controls { position: absolute; top: 760px; left: 140px; }
#dialog-photo { width: 240px; }
</style></head>
<body><div id="app"></div><script type="module">
import { createApp, h } from 'vue'
import { createAppleUI, AppleProvider, AppleImage, AppleNavibar, AppleAside, AppleDialog } from '/src/index.ts'
// White-box fixture for AppleImage's retained internal preview engine.
import { InternalImageViewer } from '/src/components/overlays.ts'
const options = new URLSearchParams(location.search)
const src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#328baa"/><circle cx="600" cy="400" r="180" fill="#ffe0a3"/><path d="M0 0L1200 800M1200 0L0 800" stroke="#12394a" stroke-width="18"/></svg>')
const photo = (id, extra = {}) => h(AppleImage, { id, gallery: { src, alt: 'Preview geometry' }, aspectRatio: '3/2', ...extra })
createApp({
  data: () => ({ visible: true, dialog: false, open: false, motion: options.get('motion') || 'full' }),
  render() { return h(AppleProvider, { motion: this.motion }, () => [
    h(AppleNavibar, { id: 'page-nav', brand: 'Navigation', items: [{ label: 'Library', value: 'library' }] }),
    h(AppleAside, { id: 'page-aside' }, () => [h('a', { href: '#library' }, 'Library'), h('a', { href: '#albums' }, 'Albums')]),
    this.visible ? photo('origin', {
      preview: !options.has('controlled'), onClick: () => { if (options.has('controlled')) this.open = true },
      style: options.get('overlap') === 'nav' ? { top: '24px' } : options.get('overlap') === 'aside' ? { left: '32px' } : options.get('overlap') === 'covered' ? { top: '12px' } : {},
      aspectRatio: options.get('overlap') === 'covered' ? '8/1' : '3/2',
    }) : null,
    this.visible && options.has('controlled') ? h(InternalImageViewer, {
      modelValue: this.open, 'onUpdate:modelValue': value => { this.open = value },
      images: [{ src }], origin: () => document.querySelector('#origin img'),
    }) : null,
    photo('second'),
    h('div', { class: 'controls' }, [
      h('button', { id: 'remove', onClick: () => { this.visible = false } }, 'Remove'),
      h('button', { id: 'dialog', onClick: () => { this.dialog = true } }, 'Dialog'),
    ]),
    h(AppleDialog, { modelValue: this.dialog, 'onUpdate:modelValue': value => { this.dialog = value }, title: 'Scoped navigation' }, () => [
      h(AppleNavibar, { id: 'dialog-nav', fixed: false, hideOnPreview: true, brand: 'Dialog navigation' }),
      photo('dialog-photo'),
    ]),
  ]) },
}).use(createAppleUI({ motion: 'full' })).mount('#app')
</script></body></html>
